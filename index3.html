<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription | Mon Site</title>
  <style>
    body {
      background-color: #f2f2f2;
      color: #333;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #4a90e2;
      color: white;
      padding: 20px 0;
    }

    form {
      background-color: white;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    form div {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    button {
      width: 100%;
      background-color: #4a90e2;
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #357abd;
    }

    .si {
      margin-top: 20px;
      display: inline-block;
      background-color: yellow;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      text-decoration: none;
      color: black;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      background-color: #eee;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenue sur mon site !</h1>
  </header>

  <main>
    <h2>Inscris-toi ici 👇</h2>
   <form action="index2.html" method="POST">

      <div>
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>
      </div>

      <div>
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required>
      </div>

      <div>
        <label for="naissance">Date de naissance :</label>
        <input type="date" id="naissance" name="naissance" required>
      </div>

      <div>
        <label for="adresse">Adresse :</label>
        <input type="text" id="adresse" name="adresse" required>
      </div>

      <div>
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="profession">Profession :</label>
        <input type="text" id="profession" name="profession" required>
      </div>

      <div>
        <label for="experience">Expérience :</label>
        <input type="text" id="experience" name="experience" required>
      </div>

      <div>
        <label for="message">Ton message :</label>
        <textarea id="message" name="message" placeholder="Écris-nous un mot sympa ici 😊"></textarea>
      </div>

      <button type="submit">S'inscrire</button>
    </form>

   
  </main>

  <footer>
    <p>&copy; 2025 Mon Site Web | SalomonStyle</p>
  </footer>

</body>
</html>
